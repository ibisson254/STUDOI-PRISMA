server {
    server_name prisma.binderstudios.com;

    # Servir ficheiros est??ticos dos builds
    root /var/www/prisma-builds;
    index index.html;

    # Proxy reverso APENAS para o webhook (Tally ??? n8n)
    location /webhook/ {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Ficheiros est??ticos
    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/prisma.binderstudios.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/prisma.binderstudios.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = prisma.binderstudios.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name prisma.binderstudios.com;
    return 404; # managed by Certbot


}